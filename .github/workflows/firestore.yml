name: Firestore rules

# firestore.rules / firestore.indexes.json を変更したら、
#   1. エミュレータ上でルールのテストを実行し（プルリクエストでも実行）
#   2. main に入ったら本番の Firebase プロジェクトへデプロイする。
# デプロイには GitHub の Secrets に FIREBASE_SERVICE_ACCOUNT（サービスアカウントJSON）が必要。
# 未登録の場合はテストだけ行い、デプロイは飛ばす。
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - scripts/test-firestore-rules.mjs
      - .github/workflows/firestore.yml
  pull_request:
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - scripts/test-firestore-rules.mjs
      - .github/workflows/firestore.yml
  workflow_dispatch:

env:
  FIREBASE_TOOLS_VERSION: 15.34.1
  RULES_UNIT_TESTING_VERSION: 5.0.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Firestore エミュレータは Java が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save @firebase/rules-unit-testing@${{ env.RULES_UNIT_TESTING_VERSION }} firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Test rules on the emulator
        run: npx firebase emulators:exec --only firestore --project demo-kaku "node scripts/test-firestore-rules.mjs"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT が未登録のため、デプロイを飛ばしました。"
            exit 0
          fi
          key_file="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key_file"
          project_id=$(jq -r .project_id "$key_file")
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy \
            --only firestore:rules,firestore:indexes \
            --project "$project_id" --non-interactive
