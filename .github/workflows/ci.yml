# 変更を送るたびに、ビルドと能力・ルールの検査、短い自動対局を回す（AI は呼ばない）
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # 自動対局 100局（エラーが出たら失敗）
      - run: npx tsx scripts/simulate-games.ts 100 1
